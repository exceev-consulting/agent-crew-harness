body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome: a new routine, a check, a helper, a profile for another kind of project, clearer docs. See what is already planned in the [roadmap](https://github.com/exceev-consulting/agent-crew-harness/blob/main/ROADMAP.md) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      placeholder: When my repository gets ..., I have to ... by hand.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What the harness should do. Who acts, what it reads, what it may write.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A new routine
        - An existing routine
        - Helpers
        - Ground rules
        - Profiles
        - Installer or skills
        - Status board
        - Docs
        - Not sure
  - type: dropdown
    id: pr
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes"
        - Maybe, with some help
        - "No"

name: Bug
description: A routine or helper did something wrong
labels: [bug]
body:
  - type: input
    id: routine
    attributes: {label: Routine or helper, placeholder: "pr-review 1.0.0, bin/notify"}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What happened, and what you expected}
    validations: {required: true}
  - type: textarea
    id: run
    attributes: {label: Run summary or output, description: "Remove tokens, hosts, IPs and names first.", render: text}
  - type: markdown
    attributes: {value: "A security problem (an agent acting on untrusted text, a leaked secret)? Use **Report a vulnerability** in the Security tab instead."}
